<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06070b">
<title>RebelDeck</title>
<style>
:root{--bg:#06070b;--panel:#0e0b18;--edge:#2a1a4a;--purple:#b973ff;--pdim:#5500aa;--lav:#e8d6ff;--dim:#8a84a3;
  --green:#50f078;--red:#ff4d6d;--amber:#ffb84d;
  --head:"Archivo","Arial Narrow","Helvetica Neue",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--lav);font:15px/1.5 var(--mono);
  background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgb(255 255 255/.018) 3px 4px);
  padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
h1{font:800 clamp(26px,6vw,40px)/1 var(--head);letter-spacing:.02em;margin:0 0 4px;color:var(--purple)}
p.sub{margin:0 0 18px;color:var(--dim)}
h2{font:700 15px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:22px 0 10px;
  display:flex;align-items:center;gap:8px}
h2 small{font:12px var(--mono);letter-spacing:0;text-transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;max-width:900px}
a.tile{display:flex;flex-direction:column;gap:10px;padding:14px;text-decoration:none;color:var(--lav);
  background:var(--panel);border:1px solid var(--edge);min-height:150px;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
a.tile:active,a.tile:hover{background:#1b1230;border-color:var(--purple)}
.mini{display:grid;gap:2px;flex:1;align-content:center;max-height:80px}
.mini i{aspect-ratio:1;background:var(--pdim);border-radius:2px;opacity:.75}
.mini i:nth-child(3n){background:var(--purple)}
.foot{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--dim)}
.dot.connected{background:var(--green)}.dot.disconnected,.dot.refused{background:var(--red)}.dot.connecting{background:var(--amber)}
.name{font:700 16px/1.15 var(--head);flex:1;overflow:hidden;text-overflow:ellipsis}
.size{color:var(--dim);font-size:12px}
.n{position:absolute;top:8px;right:12px;font:800 13px var(--head);color:var(--purple)}
a.tile{position:relative}
.empty{color:var(--dim)}
.pop{position:absolute;top:6px;left:8px;width:26px;height:22px;display:grid;place-items:center;border:1px solid var(--edge);
  background:#1b1230;color:var(--dim);font-size:14px;cursor:pointer;opacity:0;transition:opacity .1s}
a.tile:hover .pop,.pop:focus{opacity:1}.pop:hover{color:var(--lav);border-color:var(--purple)}
@media (pointer:coarse){.pop{display:none}}
footer{margin-top:28px;color:var(--dim);font-size:13px;max-width:900px}
footer a{color:var(--purple)}
</style>
</head>
<body>
<h1>RebelDeck</h1>
<p class="sub">Pick a deck. Tap away. Companion does the rest.</p>
<div id="list"><div class="empty">Rummaging for decks…</div></div>
<footer>On an iPhone or iPad: open a deck, then <b>Share → Add to Home Screen</b> and it opens full-screen like a proper app.
  On a computer, <b>⧉</b> on a deck opens it in a window of its own, without tabs or toolbars.
  · <a href="/gui">Settings</a></footer>
<script>
"use strict";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
function tile(base, d) {
  const c = Math.min(d.columns, 10), r = Math.min(d.rows, 6);
  return `<a class="tile" href="${esc(base)}/deck/${esc(d.slug)}">
    <span class="pop" role="button" tabindex="0" data-pop="${esc(base)}/deck/${esc(d.slug)}" data-c="${d.columns}" data-r="${d.rows}"
      title="Open in a window of its own: no tabs or toolbar (some browsers keep a thin address strip)">⧉</span>${d.n ? `<span class="n" title="Short address: /${d.n}">/${d.n}</span>` : ""}
    <div class="mini" style="grid-template-columns:repeat(${c},1fr);width:${Math.min(100, c * 14)}%">${"<i></i>".repeat(c * r)}</div>
    <div class="foot"><span class="dot ${esc(d.status)}"></span><span class="name">${esc(d.name)}</span>
      <span class="size">${d.columns}×${d.rows}</span></div></a>`;
}
async function load() {
  try {
    const rigs = await (await fetch("/api/rigs")).json();
    const list = document.getElementById("list");
    const many = rigs.length > 1;
    list.innerHTML = rigs.map(r => `
      ${many ? `<h2>${esc(r.name)}${r.here ? " <small>(this one)</small>" : ""}</h2>` : ""}
      <div class="grid">${r.decks.length ? r.decks.map(d => tile(r.here ? "" : r.url, d)).join("")
        : "<div class='empty'>No decks yet.</div>"}</div>`).join("");
  } catch (_) {
    document.getElementById("list").innerHTML = "<div class='empty'>Can't reach RebelDeck. Is it running?</div>";
  }
}
// ⧉: the deck in a browser window of its own, sized to the deck
document.addEventListener("click", e => {
  const b = e.target.closest("[data-pop]");
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const k = Math.max(48, Math.min(110, Math.floor(Math.min((screen.availWidth * .8) / b.dataset.c, (screen.availHeight * .7) / b.dataset.r))));
  const w = b.dataset.c * (k + 6) + 16, h = b.dataset.r * (k + 6) + 16 + 26;
  window.open(b.dataset.pop, "rebeldeck-" + b.dataset.pop.split("/").pop(), `popup=yes,width=${w},height=${h}`);
});
// after an update RebelDeck comes back as a new build: load the new page with it
let build = null;
async function checkBuild() {
  try {
    const b = (await (await fetch("/api/info")).json()).build;
    if (build && b && b !== build) location.reload();
    build = build || b;
  } catch (_) {}
}
load(); checkBuild();
setInterval(() => { load(); checkBuild(); }, 5000);
</script>
</body>
</html>
