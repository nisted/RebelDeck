<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#06070b">
<title>{{NAME}}</title>
<style>
:root{
  --bg:#06070b;--key:#0e0b18;--edge:#2a1a4a;--purple:#b973ff;--lav:#e8d6ff;
  --dim:#7d7894;--red:#ff4d6d;--green:#50f078;
  --gap:clamp(4px,1.2vmin,10px);--pad:clamp(6px,2vmin,18px);
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--lav);font:12px/1.3 var(--mono);
  overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#wrap{position:fixed;inset:0;display:grid;place-items:center;
  padding:max(var(--pad),env(safe-area-inset-top)) max(var(--pad),env(safe-area-inset-right))
          max(var(--pad),env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-left))}
#deck{display:grid;gap:var(--gap)}
.key{position:relative;width:var(--k);height:var(--k);background:var(--key);border:1px solid var(--edge);
  border-radius:8%;overflow:hidden;cursor:pointer;transition:transform .05s,filter .05s}
.key img{position:absolute;inset:0;width:100%;height:100%;image-rendering:auto;pointer-events:none}
.key span{position:absolute;inset:6%;display:flex;align-items:center;justify-content:center;text-align:center;
  white-space:pre-wrap;word-break:break-word;font-size:calc(var(--k)*.16);pointer-events:none}
.key.down{transform:scale(.93);filter:brightness(1.35)}
#status{position:fixed;top:max(6px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));
  width:8px;height:8px;border-radius:50%;background:var(--dim);opacity:.8}
#status.connected{background:var(--green);opacity:.35}
#status.disconnected,#status.refused{background:var(--red);opacity:1}
#lost{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:rgb(6 7 11/.86);
  backdrop-filter:blur(2px);padding:24px}
#lost.on{display:grid}
#lost b{display:block;color:var(--purple);font-size:clamp(16px,3.4vmin,26px);letter-spacing:.04em;margin-bottom:10px}
#lost i{font-style:normal;color:var(--dim)}
</style>
</head>
<body>
<div id="wrap"><div id="deck"></div></div>
<div id="status" title="Companion"></div>
<div id="lost"><div><b>I've got a bad feeling about this...</b><i id="why">Connecting…</i></div></div>
<script>
"use strict";
const deck = document.getElementById("deck"), lost = document.getElementById("lost"),
      why = document.getElementById("why"), dot = document.getElementById("status");
const DECK = "{{DECK}}", API = "/api/decks/" + DECK;
let cols = {{COLS}}, rows = {{ROWS}}, keys = [], serverUp = false, companion = "connecting";

let sized = false;
function sizeWindow() {
  // an app window opened by RebelDeck: fit it to the deck once, then leave it to the user
  if (sized || !/[?&]window=1/.test(location.search) || !window.resizeTo) return;
  sized = true;
  const k = {{KEYPX}}, gap = 8, pad = 14;
  const w = cols * k + (cols - 1) * gap + pad * 2, h = rows * k + (rows - 1) * gap + pad * 2;
  try { window.resizeTo(w + (outerWidth - innerWidth), h + (outerHeight - innerHeight)); } catch (_) {}
}

function fit() {
  const w = innerWidth, h = innerHeight;
  const pad = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--pad")) || 12;
  const gap = Math.max(4, Math.min(10, Math.min(w, h) * 0.012));
  const k = Math.floor(Math.min((w - pad * 2 - gap * (cols - 1)) / cols, (h - pad * 2 - gap * (rows - 1)) / rows));
  deck.style.setProperty("--k", Math.max(24, k) + "px");
  deck.style.gridTemplateColumns = `repeat(${cols}, var(--k))`;
}

function build(n) {
  deck.textContent = "";
  keys = [];
  for (let i = 0; i < n; i++) {
    const el = document.createElement("div");
    el.className = "key";
    el.innerHTML = "<img alt=''><span></span>";
    el.dataset.i = i;
    deck.appendChild(el);
    keys.push(el);
  }
  fit();
}

function paint(k) {
  const el = keys[k.i];
  if (!el) return;
  const img = el.firstChild, span = el.lastChild;
  if (k.image) { if (img.src !== k.image) img.src = k.image; img.style.display = ""; span.textContent = ""; }
  else { img.removeAttribute("src"); img.style.display = "none";
         span.textContent = k.text || ""; span.style.color = k.textColor || "#fff"; }
  el.style.background = k.image ? "#000" : (k.color && k.color !== "#000000" ? k.color : "");
}

function showStatus() {
  dot.className = companion;
  let msg = "";
  if (!serverUp) msg = "Lost contact with RebelDeck. Trying again…";
  else if (companion === "refused") msg = "Companion refused this deck. Check Companion's log.";
  else if (companion !== "connected") msg = "Waiting for Companion…";
  why.textContent = msg;
  lost.classList.toggle("on", !!msg);
}

function state(s) {
  if (s.gone) { why.textContent = "This deck's been removed. Off you pop."; lost.classList.add("on"); return; }
  if (s.name) document.title = s.name;
  if (s.cols !== cols || s.rows !== rows || keys.length !== s.keys.length) {
    cols = s.cols; rows = s.rows; build(s.keys.length);
  }
  s.keys.forEach(paint);
  sizeWindow();
  companion = s.status; showStatus();
}

// ---- taps: one finger per button, many fingers at once ----
const held = new Map();   // pointerId -> key index
function send(i, pressed) {
  fetch(API + "/press", {method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({key: i, pressed})}).catch(() => {});
}
function release(id) {
  if (!held.has(id)) return;
  const i = held.get(id); held.delete(id);
  keys[i] && keys[i].classList.remove("down");
  send(i, false);
}
deck.addEventListener("pointerdown", e => {
  const el = e.target.closest(".key");
  if (!el) return;
  e.preventDefault();
  const i = +el.dataset.i;
  held.set(e.pointerId, i);
  el.classList.add("down");
  try { el.setPointerCapture(e.pointerId); } catch (_) {}
  if (navigator.vibrate) navigator.vibrate(8);
  send(i, true);
});
for (const t of ["pointerup", "pointercancel", "lostpointercapture"])
  deck.addEventListener(t, e => release(e.pointerId));
addEventListener("blur", () => [...held.keys()].forEach(release));
addEventListener("contextmenu", e => e.preventDefault());
addEventListener("resize", fit);

// ---- live updates ----
function connect() {
  const es = new EventSource(API + "/events");
  es.addEventListener("state", e => { serverUp = true; state(JSON.parse(e.data)); });
  es.addEventListener("key", e => paint(JSON.parse(e.data)));
  es.addEventListener("status", e => { companion = JSON.parse(e.data).status; showStatus(); });
  es.addEventListener("brightness", e => {
    deck.style.filter = `brightness(${Math.max(0.15, JSON.parse(e.data).value / 100)})`;
  });
  es.addEventListener("reload", () => { es.close(); connect(); });
  es.onerror = () => { serverUp = false; showStatus(); };
  es.onopen = () => { serverUp = true; showStatus(); };
}

// keep the screen awake while the deck is open, where the browser allows it
async function awake() {
  try { if (navigator.wakeLock && document.visibilityState === "visible") await navigator.wakeLock.request("screen"); }
  catch (_) {}
}
document.addEventListener("visibilitychange", awake);

build(cols * rows);
showStatus();
connect();
awake();
</script>
</body>
</html>
