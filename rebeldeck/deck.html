<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#06070b">
<title>{{NAME}}</title>
<style>
:root{
  --bg:#06070b;--key:#0e0b18;--edge:#2a1a4a;--purple:#b973ff;--pdim:#5500aa;--lav:#e8d6ff;
  --dim:#7d7894;--red:#ff4d6d;--green:#50f078;--amber:#ffb84d;
  --gap:6px;--pad:8px;--head:26px;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"Archivo","Arial Narrow","Helvetica Neue",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:transparent}
html,body{margin:0;height:100%;color:var(--lav);font:12px/1.3 var(--mono);
  overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
body{background:var(--winbg,var(--bg))}
#head{position:fixed;left:0;right:0;top:0;height:var(--head);display:flex;align-items:center;gap:8px;
  padding:0 6px 0 10px;background:rgb(14 11 24/.92);border-bottom:1px solid var(--edge)}
#head .name{flex:1;font:800 13px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--purple);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
#dot.connected{background:var(--green)}#dot.disconnected,#dot.refused{background:var(--red)}#dot.connecting{background:var(--amber)}
.sw{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:10px;letter-spacing:.08em;cursor:pointer;flex:none}
.sw i{position:relative;width:26px;height:14px;border-radius:7px;background:#251a3d;border:1px solid var(--edge);transition:.15s}
.sw i::after{content:"";position:absolute;top:1px;left:1px;width:10px;height:10px;border-radius:50%;background:var(--dim);transition:.15s}
.sw.on i{background:var(--pdim);border-color:var(--purple)}.sw.on i::after{left:13px;background:var(--lav)}
.hbtn{flex:none;width:20px;height:20px;display:grid;place-items:center;color:var(--dim);cursor:pointer;border-radius:3px;font-size:14px}
.hbtn:hover{background:#251a3d;color:var(--lav)}
#wrap{position:fixed;left:0;right:0;bottom:0;top:var(--top,0px);display:grid;place-items:center;
  padding:max(var(--pad),env(safe-area-inset-top)) max(var(--pad),env(safe-area-inset-right))
          max(var(--pad),env(safe-area-inset-bottom)) max(var(--pad),env(safe-area-inset-left))}
body.win #wrap{padding:var(--pad)}
#deck{display:grid;gap:var(--gap)}
.key{position:relative;width:var(--k);height:var(--k);background:var(--key);border:1px solid var(--edge);
  border-radius:8%;overflow:hidden;cursor:pointer;transition:transform .05s,filter .05s}
.key img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.key span{position:absolute;inset:6%;display:flex;align-items:center;justify-content:center;text-align:center;
  white-space:pre-wrap;word-break:break-word;font-size:calc(var(--k)*.16);pointer-events:none}
.key.down{transform:scale(.93);filter:brightness(1.35)}
.key.strip{height:calc(var(--k) / var(--ratio, 2));align-self:center;border-radius:4%/8%}
.key.strip span{font-size:calc(var(--k)*.12)}
.key.gap{visibility:hidden;pointer-events:none}
/* in RebelDeck's own window a gap can still be right-clicked (to turn it back into something) */
body.win .key.gap{visibility:visible;opacity:0;pointer-events:auto;cursor:default}
body.win .key.gap:hover{opacity:1;background:transparent!important;border:1px dashed var(--edge)}
body.win .key.gap:hover>*{display:none}
.key.sticky::after{content:"";position:absolute;right:5%;top:5%;width:9%;height:9%;min-width:5px;min-height:5px;border-radius:50%;
  background:var(--dim);box-shadow:0 0 0 1px #000;z-index:3;pointer-events:none}
.key.sticky.latched{box-shadow:inset 0 0 0 3px var(--purple),0 0 10px rgb(185 115 255/.7)}
.key.sticky.latched::after{background:var(--green)}
.key.off{cursor:default}
.key.out{background:transparent!important;border:1px dashed var(--edge);cursor:default}
.key.out>*{display:none}
.key.out::after{content:"↗";position:absolute;inset:0;display:grid;place-items:center;color:var(--edge);font-size:calc(var(--k)*.3)}
/* rotary: a ring round the edge */
.key.rotary{border-radius:50%}
.key.rotary::before{content:"";position:absolute;inset:3px;border-radius:50%;border:2px solid rgb(185 115 255/.55);
  border-top-color:var(--lav);transform:rotate(var(--turn,0deg));z-index:2;pointer-events:none;transition:transform .08s}
/* fader: a slot and a cap */
.key.fader{cursor:ns-resize}
.key.fader img{opacity:.35}
.key.fader .slot{position:absolute;left:50%;top:8%;bottom:8%;width:12%;transform:translateX(-50%);border-radius:4px;
  background:#000a;border:1px solid var(--edge);z-index:2;pointer-events:none}
.key.fader .fill{position:absolute;left:0;right:0;bottom:0;height:var(--v,0%);background:var(--pdim);border-radius:3px}
.key.fader .cap{position:absolute;left:50%;width:46%;height:10%;transform:translate(-50%,50%);bottom:calc(8% + var(--v,0%) * .84);
  background:var(--lav);border-radius:3px;box-shadow:0 0 0 2px #000;z-index:3;pointer-events:none}
.key.fader .num{position:absolute;right:6%;top:6%;font-size:calc(var(--k)*.12);color:var(--lav);z-index:3;pointer-events:none}
#grip{position:fixed;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;display:none;z-index:20;
  background:linear-gradient(135deg,transparent 50%,var(--purple) 50%,var(--purple) 58%,transparent 58%,transparent 70%,var(--purple) 70%,var(--purple) 78%,transparent 78%)}
body.win.movable #grip{display:block}
#lost{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:rgb(6 7 11/.86);
  backdrop-filter:blur(2px);padding:24px;z-index:30}
#lost.on{display:grid}
#lost b{display:block;color:var(--purple);font-size:clamp(14px,3.4vmin,24px);letter-spacing:.04em;margin-bottom:10px}
#lost i{font-style:normal;color:var(--dim)}
#ident{position:fixed;inset:0;display:none;place-items:center;z-index:40;pointer-events:none;
  border:6px solid var(--purple);background:rgb(85 0 170/.55);animation:flash .5s steps(2) infinite}
#ident b{font:800 clamp(18px,8vmin,64px)/1 var(--sans);color:#fff;text-transform:uppercase;letter-spacing:.06em;text-align:center;padding:10px}
#ident.on{display:grid}
@keyframes flash{50%{background:rgb(185 115 255/.25)}}
/* right-click menu (RebelDeck's own windows) */
#menu{position:fixed;z-index:50;display:none;min-width:190px;max-width:calc(100vw - 8px);max-height:calc(100vh - 8px);overflow:auto;
  background:#120d20;border:1px solid var(--purple);box-shadow:0 6px 24px #000c;padding:4px 0;font:12px/1.2 var(--mono)}
#menu.on{display:block}
#menu .t{padding:6px 12px 4px;color:var(--purple);font:800 11px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase}
#menu .h{padding:4px 12px 2px;color:var(--dim);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
#menu .i{padding:4px 12px 4px 26px;cursor:pointer;position:relative;white-space:nowrap}
#menu .i:hover{background:#251a3d}
#menu .i.on::before{content:"●";position:absolute;left:11px;color:var(--purple);font-size:10px;top:5px}
#menu .i.off{color:var(--dim);cursor:default}#menu .i.off:hover{background:none}
#menu .sep{height:1px;background:var(--edge);margin:4px 0}
#menu .row{display:flex;align-items:center;gap:6px;padding:5px 12px 5px 26px}
#menu .row button{background:#251a3d;color:var(--lav);border:1px solid var(--edge);font:inherit;width:22px;height:20px;cursor:pointer;padding:0}
#menu .row input{width:46px;background:#06070b;color:var(--lav);border:1px solid var(--edge);font:inherit;padding:2px 4px;text-align:center}
#menu .warn{padding:4px 12px 6px 26px;color:var(--amber);font-size:11px;white-space:normal;max-width:260px}
#cap{position:fixed;inset:0;z-index:60;display:none;place-items:center;text-align:center;background:rgb(6 7 11/.93);padding:16px}
#cap.on{display:grid}
#cap b{display:block;color:var(--purple);font:800 clamp(13px,4vmin,20px)/1.2 var(--sans);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
#cap .combo{font-size:clamp(14px,5vmin,26px);color:var(--lav);min-height:1.4em;margin:6px 0}
#cap i{font-style:normal;color:var(--dim)}#cap .err{color:var(--amber)}
#toast{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:70;display:none;background:#251a3d;
  border:1px solid var(--purple);padding:6px 10px;max-width:90vw;text-align:center}
/* one broken-out key */
body.single #head{height:12px;padding:0;background:rgb(14 11 24/.7)}
body.single #head>*{display:none}
body.single{--head:12px;--pad:4px}
</style>
</head>
<body>
<div id="head">
  <span id="dot" title="Companion"></span>
  <span class="name" id="name">{{NAME}}</span>
  <label class="sw" id="float" title="Float: keep this deck on top of other windows"><i></i>FLOAT</label>
  <span class="hbtn" id="hide" title="Hide this deck (make it Visible again from the tray, pop-out or web GUI)">✕</span>
</div>
<div id="wrap"><div id="deck"></div></div>
<div id="grip" title="Drag to resize (keeps the deck's shape)"></div>
<div id="lost"><div><b>I've got a bad feeling about this...</b><i id="why">Connecting…</i></div></div>
<div id="ident"><b id="identName"></b></div>
<div id="menu" role="menu"></div>
<div id="cap"><div><b id="capTitle">Press the hotkey</b><div class="combo" id="capCombo"></div>
  <i id="capHint">Hold Ctrl, Alt or Win/Cmd and press a key (F keys work on their own). Esc to cancel.</i></div></div>
<div id="toast"></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const deck = $("deck"), lost = $("lost"), why = $("why"), dot = $("dot");
const DECK = "{{DECK}}", API = "/api/decks/" + DECK, SINGLE = "{{KEY}}";
const q = new URLSearchParams(location.search);
const WIN = q.get("window") === "1";                 // in RebelDeck's own window
const single = SINGLE !== "" ? +SINGLE : null;      // one broken-out key
let cols = {{COLS}}, rows = {{ROWS}}, keys = [], data = [], serverUp = false, companion = "connecting";
const applied = {};      // what the window was last set to (float, see-through)
let style = {showing: true, click_mode: "clickable", blocked: [], key_types: {}, breakout: [], float: true, movable: true,
             transparency: 0, colour: "#000000", faders: {}, rotary: {}, hotkeys: {}};
const STEP = 10, MOVE = 8;           // rotary: px of drag per click (default), and how far before a touch is a turn
document.body.classList.toggle("win", WIN);
document.body.classList.toggle("single", single !== null);
const showHead = WIN || single !== null || q.get("head") !== "0";
if (!showHead) $("head").style.display = "none";
if (!WIN) { $("float").style.display = "none"; $("hide").style.display = "none"; }
const api = () => window.pywebview && window.pywebview.api;

// ---- layout ----
function dims() {
  const cs = getComputedStyle(document.documentElement);
  return {pad: parseFloat(cs.getPropertyValue("--pad")) || 8, gap: parseFloat(cs.getPropertyValue("--gap")) || 6,
          head: showHead ? (parseFloat(getComputedStyle(document.body).getPropertyValue("--head")) || 26) : 0};
}
function shape() { return single !== null ? [1, 1] : [cols, rows]; }
// rows' heights in key sizes: a row of only strip buttons (and gaps) is short;
// any other row is a full key high (its strip buttons sit in the middle)
function rowUnits() {
  const short = 1 / (style.strip_ratio || 2);
  if (single !== null) return [kind(single) === "strip" ? short : 1];
  return [...Array(rows).keys()].map(r => {
    const ts = [...Array(cols).keys()].map(c => kind(r * cols + c)).filter(t => t !== "gap");
    return ts.length && ts.every(t => t === "strip") ? short : 1;
  });
}
function fit() {
  const {pad, gap, head} = dims(), [c] = shape(), units = rowUnits(), r = units.length;
  const sum = units.reduce((a, b) => a + b, 0);
  document.documentElement.style.setProperty("--top", head + "px");
  const w = innerWidth, h = innerHeight - head;
  const k = Math.floor(Math.min((w - pad * 2 - gap * (c - 1)) / c, (h - pad * 2 - gap * (r - 1)) / sum));
  deck.style.setProperty("--k", Math.max(16, k) + "px");
  deck.style.gridTemplateColumns = `repeat(${c}, var(--k))`;
  deck.style.gridTemplateRows = units.map(u => `calc(var(--k) * ${u})`).join(" ");
  deck.style.setProperty("--ratio", style.strip_ratio || 2);
}
// the window's height for a given width, so the deck fills it with no letterbox
function heightFor(w) {
  const {pad, gap, head} = dims(), [c] = shape(), units = rowUnits();
  const k = (w - pad * 2 - gap * (c - 1)) / c;
  return Math.round(head + pad * 2 + k * units.reduce((a, b) => a + b, 0) + gap * (units.length - 1));
}

function build() {
  deck.textContent = "";
  keys = [];
  const list = single !== null ? [single] : [...Array(cols * rows).keys()];
  for (const i of list) {
    const el = document.createElement("div");
    el.className = "key";
    el.innerHTML = "<img alt=''><span></span>";
    el.dataset.i = i;
    deck.appendChild(el);
    keys[i] = el;
  }
  applyStyle();
  fit();
}

function kind(i) { return style.key_types[String(i)] || "button"; }
function clickable(i) {
  return style.click_mode === "clickable" || (style.click_mode === "hybrid" && !style.blocked.includes(i));
}

function applyStyle() {
  const hex = style.colour || "#000000", a = 1 - (style.transparency || 0) / 100;
  const [r, g, b] = [1, 3, 5].map(o => parseInt(hex.substr(o, 2), 16));
  document.body.style.setProperty("--winbg", `rgba(${r},${g},${b},${a})`);
  document.body.classList.toggle("movable", !!style.movable);
  $("head").style.cursor = WIN && style.movable ? "move" : "";
  $("float").classList.toggle("on", !!style.float);
  $("name").textContent = style.name || $("name").textContent;
  if (style.name) document.title = style.name;
  for (const [i, el] of keys.entries()) {
    if (!el) continue;
    const t = kind(i), out = single === null && style.breakout.includes(i);
    el.classList.toggle("gap", t === "gap");
    el.classList.toggle("strip", t === "strip");
    el.classList.toggle("rotary", t === "rotary");
    el.classList.toggle("fader", t === "fader");
    el.classList.toggle("sticky", t === "sticky");
    el.classList.toggle("out", out);
    el.classList.toggle("off", !clickable(i));
    if (t === "fader" && !el.querySelector(".slot")) {
      el.insertAdjacentHTML("beforeend", "<div class='slot'><div class='fill'></div></div><div class='cap'></div><div class='num'></div>");
    } else if (t !== "fader") el.querySelectorAll(".slot,.cap,.num").forEach(x => x.remove());
    if (t === "fader") setFader(i, style.faders[String(i)] || 0);
  }
}

function setFader(i, v) {
  const el = keys[i];
  if (!el) return;
  el.style.setProperty("--v", (v / 127 * 100) + "%");
  const n = el.querySelector(".num");
  if (n) n.textContent = v;
  style.faders[String(i)] = v;
}

function where(i) {
  const loc = data[i] && data[i].location;
  return loc ? `Button ${loc}` : `Row ${Math.floor(i / cols)}, column ${i % cols}`;
}
function paint(k) {
  data[k.i] = k;
  const el = keys[k.i];
  if (!el) return;
  el.title = where(k.i) + (style.hotkeys[String(k.i)] ? ` · hotkey ${keyLabel(style.hotkeys[String(k.i)])}` : "");
  el.classList.toggle("latched", !!k.latched);
  const img = el.querySelector("img"), span = el.querySelector("span");
  if (k.image) { if (img.src !== k.image) img.src = k.image; img.style.display = ""; span.textContent = ""; }
  else { img.removeAttribute("src"); img.style.display = "none";
         span.textContent = k.text || ""; span.style.color = k.textColor || "#fff"; }
  el.style.background = k.image ? "#000" : (k.color && k.color !== "#000000" ? k.color : "");
}

function showStatus() {
  dot.className = companion;
  let msg = "";
  if (!serverUp) msg = "Lost contact with RebelDeck. Trying again…";
  else if (companion === "refused") msg = "Companion refused this deck. Check Companion's log.";
  else if (companion !== "connected") msg = "Waiting for Companion…";
  why.textContent = msg;
  lost.classList.toggle("on", !!msg);
}

function state(s) {
  if (s.gone) { why.textContent = "This deck's been removed. Off you pop."; lost.classList.add("on"); return; }
  const shapeWas = JSON.stringify([style.key_types, style.strip_ratio]);
  const rebuild = s.cols !== cols || s.rows !== rows || !keys.length ||
    shapeWas !== JSON.stringify([(s.style || {}).key_types, (s.style || {}).strip_ratio]);
  cols = s.cols; rows = s.rows;
  style = Object.assign(style, s.style || {});
  if (rebuild) build(); else applyStyle();
  s.keys.forEach(paint);
  companion = s.status; showStatus();
  if (rebuild && WIN) snapToShape();
  if (WIN && api()) {
    // the window follows the deck's settings, wherever they were changed
    if (!style.showing || (single !== null && !style.breakout.includes(single))) api().close();
    if (applied.float !== undefined && applied.float !== style.float) api().set_float(style.float);
    if (applied.transparency !== undefined && applied.transparency !== style.transparency && api().set_see_through)
      api().set_see_through(style.transparency);
  }
  applied.float = style.float; applied.transparency = style.transparency;
}

// ---- input ----
function post(path, body) {
  return fetch(API + path, {method: "POST", headers: {"Content-Type": "application/json"},
               body: JSON.stringify(body)}).catch(() => {});
}
const held = new Map();   // pointerId -> {i, kind, x, y, moved, pressed}
function rot(i) { return Object.assign({step: STEP, vertical: false}, style.rotary[String(i)] || {}); }
function release(id) {
  const h = held.get(id);
  if (!h) return;
  held.delete(id);
  keys[h.i] && keys[h.i].classList.remove("down");
  if (h.kind === "fader") { sendFader(h.i, true); return; }
  if (h.kind === "rotary") {
    // as ScreenDeck: it never moved far enough to be a turn, so it's a push (down, then up)
    if (!h.moved) post("/press", {key: h.i, pressed: true}).then(() => post("/press", {key: h.i, pressed: false}));
    return;
  }
  if (h.pressed) post("/press", {key: h.i, pressed: false});
}
deck.addEventListener("pointerdown", e => {
  if (e.button === 2) return;                          // right-click: the menu
  const el = e.target.closest(".key");
  if (!el || el.classList.contains("out")) return;
  const i = +el.dataset.i, k = kind(i);
  if (k === "gap" || !clickable(i)) return;
  e.preventDefault();
  closeMenu();
  const h = {i, kind: k, x: e.clientX, y: e.clientY, moved: false, pressed: false, done: 0};
  held.set(e.pointerId, h);
  try { el.setPointerCapture(e.pointerId); } catch (_) {}
  if (navigator.vibrate) navigator.vibrate(8);
  if (k === "fader") { faderAt(h, el, e.clientY); return; }
  el.classList.add("down");
  if (k !== "rotary") { h.pressed = true; post("/press", {key: i, pressed: true}); }   // buttons, strips, sticky
});
deck.addEventListener("pointermove", e => {
  const h = held.get(e.pointerId);
  if (!h) return;
  const el = keys[h.i];
  if (h.kind === "fader") return faderAt(h, el, e.clientY);
  if (h.kind !== "rotary") return;
  const o = rot(h.i);
  // along the drag direction: right, or up, turns clockwise
  const along = o.vertical ? h.y - e.clientY : e.clientX - h.x;
  if (!h.moved) {
    if (Math.hypot(e.clientX - h.x, e.clientY - h.y) < MOVE) return;
    h.moved = true; h.from = along;                   // now it's a turn, from here
    el.classList.remove("down");
  }
  const steps = Math.trunc((along - h.from) / o.step) - h.done;
  if (steps) { h.done += steps; turn(h.i, steps); }
});
for (const t of ["pointerup", "pointercancel", "lostpointercapture"])
  deck.addEventListener(t, e => release(e.pointerId));
const wheelAcc = {};
deck.addEventListener("wheel", e => {
  const el = e.target.closest(".key");
  if (!el) return;
  const i = +el.dataset.i;
  if (!clickable(i)) return;
  if (kind(i) === "rotary") {
    e.preventDefault();
    // a mouse wheel notch is one click; a trackpad's small scrolls add up to one
    const d = e.deltaMode ? e.deltaY * 40 : e.deltaY;
    wheelAcc[i] = (wheelAcc[i] || 0) + d;
    if (Math.abs(wheelAcc[i]) >= 40) { turn(i, wheelAcc[i] < 0 ? 1 : -1); wheelAcc[i] = 0; }
  }
  else if (kind(i) === "fader") {
    e.preventDefault();
    const v = Math.max(0, Math.min(127, (style.faders[String(i)] || 0) + (e.deltaY < 0 ? 2 : -2)));
    setFader(i, v); sendFader(i, true);
  }
}, {passive: false});
const turns = {};
function turn(i, steps) {
  turns[i] = (turns[i] || 0) + steps * 15;
  keys[i] && keys[i].style.setProperty("--turn", turns[i] + "deg");
  post("/rotate", {key: i, steps});
}
function faderAt(h, el, y) {
  const r = el.getBoundingClientRect();
  const top = r.top + r.height * .08, bottom = r.bottom - r.height * .08;
  const v = Math.round(Math.max(0, Math.min(1, (bottom - y) / (bottom - top))) * 127);
  if (v !== style.faders[String(h.i)]) { setFader(h.i, v); sendFader(h.i, false); }
}
const faderTimers = {}, faderSent = {};
function sendFader(i, now) {
  const go = () => {
    faderTimers[i] = null;
    const v = style.faders[String(i)] || 0;
    if (faderSent[i] === v) return;
    faderSent[i] = v;
    post("/fader", {key: i, value: v});
  };
  if (now) { clearTimeout(faderTimers[i]); return go(); }
  if (!faderTimers[i]) faderTimers[i] = setTimeout(go, 40);
}
addEventListener("blur", () => [...held.keys()].forEach(release));
addEventListener("contextmenu", e => { e.preventDefault(); if (WIN) openMenu(e); });
addEventListener("resize", fit);

// ---- RebelDeck's own window: float, hide, resize locked to the deck's shape ----
$("float").addEventListener("click", () => {
  style.float = !style.float;
  applied.float = style.float;
  $("float").classList.toggle("on", style.float);
  if (api()) api().set_float(style.float);
  fetch(API, {method: "PUT", headers: {"Content-Type": "application/json"},
              body: JSON.stringify(single === null ? {float: style.float} : {})}).catch(() => {});
});
$("hide").addEventListener("click", () => {
  fetch(API, {method: "PUT", headers: {"Content-Type": "application/json"},
              body: JSON.stringify({showing: false})}).catch(() => {});
});
function snapToShape() {
  if (!api()) return;
  const w = innerWidth, h = heightFor(w);
  if (Math.abs(h - innerHeight) > 2) api().resize(w, h);
}
// moving the window by its header (RebelDeck moves it; the float switch and ✕ aren't handles)
let moving = null, moveRaf = 0;
$("head").addEventListener("pointerdown", e => {
  if (!WIN || !style.movable || !api() || !api().drag_start || e.target.closest(".sw,.hbtn")) return;
  e.preventDefault();
  moving = {x: e.screenX, y: e.screenY};
  $("head").setPointerCapture(e.pointerId);
  api().drag_start();
});
$("head").addEventListener("pointermove", e => {
  if (!moving || moveRaf) return;
  const dx = e.screenX - moving.x, dy = e.screenY - moving.y;
  moveRaf = requestAnimationFrame(() => { moveRaf = 0; if (moving) api().drag_to(dx, dy); });
});
for (const t of ["pointerup", "pointercancel"])
  $("head").addEventListener(t, () => { if (moving && api()) api().drag_end(); moving = null; });
let grip = null;
$("grip").addEventListener("pointerdown", e => {
  if (!style.movable) return;
  e.preventDefault();
  grip = {x: e.screenX, w: innerWidth, id: e.pointerId};
  $("grip").setPointerCapture(e.pointerId);
});
let raf = 0;
$("grip").addEventListener("pointermove", e => {
  if (!grip || raf) return;
  const sx = e.screenX;
  raf = requestAnimationFrame(() => {
    raf = 0;
    const w = Math.max(single !== null ? 40 : 120, Math.round(grip.w + sx - grip.x));
    if (api()) api().resize(w, heightFor(w));
  });
});
for (const t of ["pointerup", "pointercancel"])
  $("grip").addEventListener(t, () => { if (grip && api()) api().save_geometry(); grip = null; });
window.addEventListener("pywebviewready", () => { setTimeout(snapToShape, 50); });

// ---- right-click menu on a key (RebelDeck's own windows), as ScreenDeck's ----
const menu = $("menu");
const PLAT = /Mac/.test(navigator.platform) ? "mac" : /Win/.test(navigator.platform) ? "windows" : "linux";
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
function keyLabel(hk) { return String(hk).replace("Super", PLAT === "mac" ? "Cmd" : PLAT === "windows" ? "Win" : "Super").replace(/\+/g, " + "); }
function toast(t) {
  const el = $("toast"); el.textContent = t; el.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = "none", 3000);
}
async function save(body, msg) {
  try {
    const r = await fetch(API, {method: "PUT", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status);
    if (msg) toast(msg);
    return true;
  } catch (e) { toast("Didn't save: " + e.message); return false; }
}
const TYPES = [["button", "Button"], ["sticky", "Sticky: click on, click off"], ["rotary", "Rotary"],
               ["fader", "Fader"], ["strip", "Strip (wide and short)"], ["gap", "Gap (empty space)"]];
let menuKey = null, menuAt = [0, 0], menuProblem = null;
function closeMenu() { menu.classList.remove("on"); menuKey = null; }
function drawMenu() {
  const i = menuKey, t = kind(i), k = String(i), hk = style.hotkeys[k], sep = "<div class='sep'></div>";
  let h = `<div class="t">${esc(where(i))}</div><div class="h">Make it</div>`;
  for (const [v, label] of TYPES) h += `<div class="i${t === v ? " on" : ""}" data-type="${v}">${label}</div>`;
  if (t === "rotary") {
    const o = rot(i);
    h += sep + `<div class="h">Rotary</div>
      <div class="row" title="How far a drag goes for each click of the dial">Step <button data-step="-2">−</button><input id="mstep" type="number" min="2" max="200" value="${o.step}"><button data-step="2">+</button> px</div>
      <div class="i${o.vertical ? "" : " on"}" data-drag="h">Drag side to side</div>
      <div class="i${o.vertical ? " on" : ""}" data-drag="v">Drag up and down</div>`;
  }
  if (t === "sticky" && data[i] && data[i].latched) h += `<div class="i" data-act="letgo">Let go (it's held down)</div>`;
  if (t !== "gap" && t !== "fader") {
    h += sep + `<div class="h">Hotkey${hk ? ": " + esc(keyLabel(hk)) : ""}</div>
      <div class="i" data-act="hotkey">${hk ? "Change hotkey…" : "Assign hotkey…"}</div>` +
      (hk ? `<div class="i" data-act="nohotkey">Clear hotkey</div>` : "") +
      (hk && menuProblem ? `<div class="warn">⚠ Not working: ${esc(menuProblem)}</div>` : "");
  }
  const out = style.breakout.includes(i);
  h += sep + (single !== null ? `<div class="i" data-act="back">Back into the deck</div>`
                              : `<div class="i" data-act="out">${out ? "Back into the deck" : "Break out into its own window"}</div>`);
  menu.innerHTML = h;
  menu.classList.add("on");
  const r = menu.getBoundingClientRect();
  menu.style.left = Math.max(4, Math.min(menuAt[0], innerWidth - r.width - 4)) + "px";
  menu.style.top = Math.max(4, Math.min(menuAt[1], innerHeight - r.height - 4)) + "px";
}
async function openMenu(e) {
  const el = e.target.closest(".key");
  if (!el || capturing !== null) { closeMenu(); return; }
  const i = +el.dataset.i;
  menuKey = i; menuAt = [e.clientX, e.clientY]; menuProblem = null;
  drawMenu();
  try {   // why its hotkey isn't working, if it isn't
    const me = (await (await fetch("/api/decks")).json()).find(d => d.id === DECK);
    const p = me && me.hotkey_problems && me.hotkey_problems[String(i)];
    if (p && menuKey === i) { menuProblem = p; drawMenu(); }
  } catch (_) {}
}
let stepT = null;
function saveStep(i, v) {
  v = Math.max(2, Math.min(200, Math.round(+v) || STEP));
  style.rotary = Object.assign({}, style.rotary, {[String(i)]: Object.assign(rot(i), {step: v})});
  const inp = $("mstep"); if (inp) inp.value = v;
  clearTimeout(stepT); stepT = setTimeout(() => save({rotary: style.rotary}), 400);
}
menu.addEventListener("click", e => {
  const x = e.target.closest("[data-type],[data-drag],[data-act],[data-step]");
  if (!x || menuKey === null) return;
  const i = menuKey, k = String(i), a = x.dataset.act;
  if (x.dataset.type) {
    const kt = Object.assign({}, style.key_types);
    if (x.dataset.type === "button") delete kt[k]; else kt[k] = x.dataset.type;
    closeMenu();
    if (x.dataset.type !== kind(i)) save({key_types: kt}, "Saved. Companion re-registers the deck for the new layout.");
  } else if (x.dataset.drag) {
    style.rotary = Object.assign({}, style.rotary, {[k]: Object.assign(rot(i), {vertical: x.dataset.drag === "v"})});
    drawMenu(); save({rotary: style.rotary});
  } else if (x.dataset.step) {
    saveStep(i, rot(i).step + +x.dataset.step);
  } else if (a === "letgo") { closeMenu(); post("/let-go", {key: i}); }
  else if (a === "hotkey") { closeMenu(); capture(i); }
  else if (a === "nohotkey") {
    const hks = Object.assign({}, style.hotkeys); delete hks[k];
    closeMenu(); save({hotkeys: hks}, "Hotkey cleared.");
  } else if (a === "out" || a === "back") {
    const out = new Set(style.breakout);
    out.has(i) ? out.delete(i) : out.add(i);
    closeMenu(); save({breakout: [...out]});
  }
});
menu.addEventListener("change", e => { if (e.target.id === "mstep" && menuKey !== null) saveStep(menuKey, e.target.value); });
menu.addEventListener("pointerdown", e => e.stopPropagation());
document.addEventListener("pointerdown", e => { if (!menu.contains(e.target)) closeMenu(); }, true);
addEventListener("blur", closeMenu);

// ---- assigning a hotkey: press it ----
let capturing = null;
const NAMED = {ArrowUp: "Up", ArrowDown: "Down", ArrowLeft: "Left", ArrowRight: "Right", Space: "Space", Home: "Home",
               End: "End", PageUp: "PageUp", PageDown: "PageDown", Insert: "Insert", Delete: "Delete"};
function codeKey(c) {
  let m;
  if ((m = /^Key([A-Z])$/.exec(c))) return m[1];
  if ((m = /^Digit(\d)$/.exec(c))) return m[1];
  if ((m = /^Numpad(\d)$/.exec(c))) return "Num" + m[1];
  if (/^F([1-9]|1\d|2[0-4])$/.test(c)) return c;
  return NAMED[c] || null;
}
const HINT = "Hold Ctrl, Alt or " + (PLAT === "mac" ? "Cmd" : "Win") + " and press a key (F keys work on their own). Esc to cancel.";
function capture(i) {
  capturing = i;
  $("capTitle").textContent = "Hotkey for " + where(i);
  $("capCombo").textContent = style.hotkeys[String(i)] ? keyLabel(style.hotkeys[String(i)]) : "";
  $("capHint").textContent = HINT; $("capHint").className = "";
  $("cap").classList.add("on");
}
function endCapture() { capturing = null; $("cap").classList.remove("on"); }
$("cap").addEventListener("pointerdown", e => { if (e.target === $("cap")) endCapture(); });
addEventListener("keydown", async e => {
  if (capturing === null) { if (e.key === "Escape") closeMenu(); return; }
  e.preventDefault(); e.stopPropagation();
  if (e.key === "Escape" && !e.ctrlKey && !e.altKey && !e.metaKey && !e.shiftKey) return endCapture();
  const mods = [e.ctrlKey && "Ctrl", e.altKey && "Alt", e.shiftKey && "Shift", e.metaKey && "Super"].filter(Boolean);
  const modOnly = ["Control", "Alt", "Shift", "Meta", "OS", "AltGraph"].includes(e.key);
  const key = modOnly ? null : codeKey(e.code);
  $("capCombo").textContent = keyLabel([...mods, ...(key ? [key] : [])].join("+"));
  const hint = (t, bad) => { $("capHint").textContent = t; $("capHint").className = bad ? "err" : ""; };
  if (modOnly) return;
  if (!key) return hint("That key can't be a hotkey: letters, numbers, F keys, the number pad, arrows, Space, Home/End, Page Up/Down, Insert and Delete can.", true);
  if (!mods.some(m => m !== "Shift") && !/^F\d+$/.test(key)) return hint("Add Ctrl, Alt or " + (PLAT === "mac" ? "Cmd" : "Win") + " too, or it'd go off while you type. (F keys work on their own.)", true);
  const hk = [...mods, key].join("+"), i = capturing;
  if (await save({hotkeys: Object.assign({}, style.hotkeys, {[String(i)]: hk})})) {
    endCapture(); toast(`${keyLabel(hk)} now presses ${where(i)}`);
  } else hint("Try another: " + ($("toast").textContent.replace(/^Didn't save: /, "")), true);
}, true);

// ---- live updates ----
function identify() {
  $("identName").textContent = style.name || document.title;
  $("ident").classList.add("on");
  if (WIN && api() && api().front) api().front();
  clearTimeout(identify.t);
  identify.t = setTimeout(() => $("ident").classList.remove("on"), 3000);
}
function connect() {
  const es = new EventSource(API + "/events");
  es.addEventListener("state", e => { serverUp = true; state(JSON.parse(e.data)); });
  es.addEventListener("key", e => paint(JSON.parse(e.data)));
  es.addEventListener("status", e => { companion = JSON.parse(e.data).status; showStatus(); });
  es.addEventListener("brightness", e => {
    // Companion's brightness dims the buttons only, never the window (ScreenDeck #89)
    deck.style.filter = `brightness(${Math.max(0.15, JSON.parse(e.data).value / 100)})`;
  });
  es.addEventListener("fader", e => { const f = JSON.parse(e.data); setFader(f.i, f.value); faderSent[f.i] = f.value; });
  es.addEventListener("identify", identify);
  es.addEventListener("reload", () => { es.close(); connect(); });
  es.onerror = () => { serverUp = false; showStatus(); };
  es.onopen = () => { serverUp = true; showStatus(); checkBuild(); };
}
// after an update, RebelDeck comes back as a new build: load the new page with it
let loadedBuild = null;
async function checkBuild() {
  try {
    const b = (await (await fetch("/api/info")).json()).build;
    if (loadedBuild && b && b !== loadedBuild) location.reload();
    loadedBuild = loadedBuild || b;
  } catch (_) {}
}

// keep the screen awake while the deck is open, where the browser allows it
async function awake() {
  try { if (navigator.wakeLock && document.visibilityState === "visible") await navigator.wakeLock.request("screen"); }
  catch (_) {}
}
document.addEventListener("visibilitychange", awake);

build();
showStatus();
connect();
awake();
</script>
</body>
</html>
